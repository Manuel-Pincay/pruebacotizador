{# Bolita de color según el nombre/hex guardado #}
{% macro color_dot(color_name, size='w-3 h-3') -%}
{%- set css = color_to_css(color_name) -%}
{%- if css -%}
<span class="{{ size }} rounded-full border border-black/15 shrink-0 inline-block"
      style="background-color: {{ css }};{% if css == 'transparent' or css|lower in ['#fff', '#ffffff', '#f8fafc'] %} box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);{% endif %}"
      title="{{ color_name }}"></span>
{%- elif color_name and color_name not in ['-', '—'] -%}
<span class="{{ size }} rounded-full border border-dashed border-gray-300 bg-gray-100 shrink-0 inline-block"
      title="{{ color_name }}"></span>
{%- else -%}
<span class="{{ size }} rounded-full border border-gray-200 bg-gray-100 shrink-0 inline-block opacity-50"
      title="Sin color"></span>
{%- endif -%}
{%- endmacro %}
